    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background:
        radial-gradient(circle at center, transparent 20%, rgba(17, 18, 20, 0.08) 115%),
        repeating-linear-gradient(0deg, rgba(255,255,255,0.015) 0 1px, transparent 1px 4px);
      mix-blend-mode: multiply;
    }

    .page {
      position: relative;
      z-index: 1;
      width: min(1120px, calc(100% - 36px));
      min-height: 100svh;
      margin: 0 auto;
      padding: clamp(24px, 5vw, 64px) 0 22px;
      display: grid;
      grid-template-rows: auto 1fr auto;
    }

    .masthead {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 24px;
    }

    .eyebrow {
      margin: 0 0 8px;
      color: var(--red);
      font-size: 0.76rem;
      font-weight: 900;
      letter-spacing: 0.2em;
      text-transform: uppercase;
    }

    h1 {
      max-width: 720px;
      margin: 0;
      font-family: Impact, "Arial Narrow", Arial, sans-serif;
      font-size: clamp(2.75rem, 8vw, 7.5rem);
      font-weight: 900;
      letter-spacing: -0.035em;
      line-height: 0.83;
      text-transform: uppercase;
      color: var(--red);
      -webkit-text-stroke: 2px var(--ink);
      paint-order: stroke fill;
      text-shadow: 5px 5px 0 var(--ink);
    }

    .year-stamp {
      margin-top: 5px;
      padding: 8px 9px 6px;
      border: 2px solid var(--ink);
      font-size: 0.78rem;
      font-weight: 900;
      letter-spacing: 0.12em;
      writing-mode: vertical-rl;
    }

    main {
      display: grid;
      place-items: center;
      padding: clamp(42px, 8vh, 92px) 0;
    }

    .panel {
      width: min(680px, 100%);
      padding: clamp(24px, 5vw, 54px);
      border: 3px solid var(--ink);
      background: rgba(231, 193, 116, 0.93);
      box-shadow: 13px 13px 0 var(--ink);
      backdrop-filter: blur(2px);
    }

    .prompt {
      margin: 0 0 22px;
      font-family: Impact, "Arial Narrow", Arial, sans-serif;
      font-size: clamp(1.7rem, 5vw, 3rem);
      letter-spacing: 0.01em;
      line-height: 1;
      text-transform: uppercase;
    }

    .input-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 10px;
    }

    input,
    button {
      min-height: 54px;
      border: 3px solid var(--ink);
      border-radius: 0;
      color: var(--ink);
      font: inherit;
    }

    input {
      width: 100%;
      padding: 10px 14px;
      background: rgba(248, 222, 164, 0.8);
      font-size: 1.2rem;
      font-weight: 800;
      outline: none;
    }

    input:focus-visible,
    button:focus-visible {
      outline: 4px solid var(--red);
      outline-offset: 3px;
    }

    button {
      padding: 10px 20px;
      background: var(--ink);
      color: var(--paper-light);
      cursor: pointer;
      font-weight: 900;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      transition: transform 150ms ease, box-shadow 150ms ease;
    }

    button:hover {
      transform: translate(-2px, -2px);
      box-shadow: 4px 4px 0 var(--red);
    }

    .note {
      min-height: 1.4em;
      margin: 12px 0 0;
      color: #78100e;
      font-size: 0.92rem;
      font-weight: 800;
    }

    .result[hidden],
    .entry[hidden] { display: none; }

    .result-year {
      margin: 0 0 10px;
      color: var(--red);
      font-size: 0.78rem;
      font-weight: 900;
      letter-spacing: 0.19em;
      text-transform: uppercase;
    }

    .headline {
      max-width: 570px;
      margin: 0;
      font-family: Impact, "Arial Narrow", Arial, sans-serif;
      font-size: clamp(2.5rem, 8vw, 6rem);
      font-weight: 900;
      letter-spacing: -0.025em;
      line-height: 0.92;
      text-transform: uppercase;
    }

    .facts {
      margin: 28px 0 30px;
      padding: 0;
      border-top: 3px solid var(--ink);
      list-style: none;
    }

    .facts li {
      position: relative;
      padding: 15px 12px 14px 28px;
      border-bottom: 1px solid var(--line);
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(1rem, 2.5vw, 1.25rem);
      font-weight: 700;
      line-height: 1.35;
    }

    .facts li::before {
      content: "";
      position: absolute;
      top: 1.25em;
      left: 4px;
      width: 10px;
      height: 10px;
      background: var(--red);
      transform: rotate(45deg);
    }

    .try-another { background: var(--red); }

    footer {
      max-width: 760px;
      padding-top: 16px;
      border-top: 2px solid var(--ink);
      font-size: 0.72rem;
      font-weight: 800;
      letter-spacing: 0.055em;
      line-height: 1.5;
      text-transform: uppercase;
    }

    @media (max-width: 600px) {
      body { background-position: 42% center; }
      .page { width: min(100% - 24px, 1120px); padding-top: 24px; }
      .masthead { gap: 12px; }
      h1 { font-size: clamp(2.6rem, 15vw, 4.8rem); }
      .year-stamp { display: none; }
      main { padding: 38px 0 54px; }
      .panel { padding: 24px 20px 28px; box-shadow: 8px 8px 0 var(--ink); }
      .input-row { grid-template-columns: 1fr; }
      button { width: 100%; }
      .headline { font-size: clamp(2.5rem, 16vw, 4.7rem); }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        scroll-behavior: auto !important;
        transition-duration: 0.001ms !important;
        animation-duration: 0.001ms !important;
        animation-iteration-count: 1 !important;
      }
    }
  </style>
</head>

      { year: 1993, label: "Jurassic Park came out", noun: "Jurassic Park" },
      { year: 2004, label: "Facebook launched", noun: "Facebook" },
      { year: 2007, label: "the iPhone was announced", noun: "the iPhone" },
      { year: 2020, label: "the pandemic began", noun: null }
    ]);

    const form = document.getElementById("year-form");
    const input = document.getElementById("year-input");
    const note = document.getElementById("input-note");
    const entry = document.getElementById("entry");
    const result = document.getElementById("result");
    const resultYear = document.getElementById("result-year");
    const headline = document.getElementById("result-headline");
    const facts = document.getElementById("result-facts");
    const resetButton = document.getElementById("try-another");
    const now = new Date().getFullYear();

    document.getElementById("current-year").textContent = String(now);

    function formatYear(year) {
      return year < 0 ? `${Math.abs(year)} BC` : String(year);
    }

    function anchorPhrase(anchor) {
      return anchor.approximate ? `roughly when ${anchor.label}` : anchor.label;
    }

    function computeLines(year, currentYear) {
      const elapsed = currentYear - year;
      let title;

      if (year > currentYear) title = `That's ${year - currentYear} years from now.`;
      else if (year === currentYear) title = "That's this year.";
      else title = `${elapsed} years ago.`;

      const context = [];
      const qualifying = anchors
        .filter(anchor => anchor.year < year && year - anchor.year < elapsed)
        .sort((a, b) => (year - b.year) - (year - a.year));

      if (qualifying.length > 0) {
        context.push(`That's closer to ${anchorPhrase(qualifying[0])} than to today.`);
      }

      const ageAnchors = anchors
        .filter(anchor => anchor.noun && anchor.year < year && (year - anchor.year) >= 20)
        .sort((a, b) => b.year - a.year)
        .slice(0, 2);

      ageAnchors.forEach(anchor => {
        const age = year - anchor.year;
        const qualifier = anchor.approximate ? "roughly " : "";
        context.push(`${anchor.noun} was ${qualifier}${age} years old.`);
      });

      if (year <= currentYear) {
        context.push(`Someone born that year turns ${elapsed} this year.`);
      }

      if (context.length < 2) {
        const nearest = anchors
          .slice()
          .sort((a, b) => Math.abs(a.year - year) - Math.abs(b.year - year))[0];

        if (nearest.year < year) {
          const qualifier = nearest.approximate ? "Roughly, " : "";
          context.push(`${qualifier}${nearest.label} was ${year - nearest.year} years earlier.`);
        } else if (nearest.year > year) {
          const qualifier = nearest.approximate ? "Roughly, " : "";
          context.push(`${qualifier}${nearest.label} was still ${nearest.year - year} years away.`);
        } else {
          const qualifier = nearest.approximate ? "Roughly, " : "";
          context.push(`${qualifier}${nearest.label} that year.`);
        }
      }

      if (context.length < 2) {
        const secondNearest = anchors
          .slice()
          .sort((a, b) => Math.abs(a.year - year) - Math.abs(b.year - year))[1];
        const distance = Math.abs(secondNearest.year - year);
        const direction = secondNearest.year < year ? "earlier" : "away";
        const qualifier = secondNearest.approximate ? "Roughly, " : "";
        context.push(`${qualifier}${secondNearest.label} was ${distance} years ${direction}.`);
      }

      return { yearLabel: formatYear(year), title, context };
    }

    function showResult(year) {
      const output = computeLines(year, now);
      resultYear.textContent = `The year ${output.yearLabel}`;
      headline.textContent = output.title;
      facts.replaceChildren();

      output.context.forEach(line => {
        const item = document.createElement("li");
        item.textContent = line;
        facts.appendChild(item);
      });

      entry.hidden = true;
      result.hidden = false;
      resetButton.focus();
    }

    form.addEventListener("submit", event => {
      event.preventDefault();
      const raw = input.value.trim();

      if (raw === "" || !/^-?\d+$/.test(raw)) {
        note.textContent = "Enter a whole year, such as 1994 or -30 for 30 BC.";
        input.focus();
        return;
      }

      const year = Number(raw);
      if (!Number.isSafeInteger(year) || year < -3000 || year > 3000) {
        note.textContent = "Let's stay somewhere the anchors can reach.";
        input.focus();
        return;
      }

      note.textContent = "";
      showResult(year);
    });

    resetButton.addEventListener("click", () => {
      result.hidden = true;
      entry.hidden = false;
      input.value = "";
      note.textContent = "";
      input.focus();
    });
  </script>
</body>
</html>
