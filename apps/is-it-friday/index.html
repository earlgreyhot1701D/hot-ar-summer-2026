<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Is It Friday?</title>
  <meta property="og:title" content="Is It Friday?" />
  <meta property="og:description" content="The whole app is one word." />
  <meta property="og:type" content="website" />
  <meta property="og:image" content="SITE_URL/og-isitfriday.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Is It Friday?" />
  <meta name="twitter:description" content="The whole app is one word." />
  <meta name="twitter:image" content="SITE_URL/og-isitfriday.png" />
  <style>
    :root {
      color-scheme: light;
      --paper: #e8dec0;
      --paper-light: #f3ecd5;
      --sky: #c6e2e2;
      --sky-pale: #e9efdf;
      --ink: #17303a;
      --ink-soft: #36505a;
      --olive: #72764c;
      --olive-dark: #424b3d;
      --brass: #bca354;
      --brass-light: #eee1a0;
    }

    * { box-sizing: border-box; }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
    }

    body {
      display: grid;
      place-items: center;
      padding: clamp(7px, 1.2vmin, 14px);
      color: var(--ink);
      background:
        radial-gradient(circle at 13% 21%, rgba(255,255,255,.24) 0 1px, transparent 1.6px),
        radial-gradient(circle at 74% 72%, rgba(23,48,58,.08) 0 .8px, transparent 1.4px),
        linear-gradient(115deg, rgba(89,75,44,.04), transparent 38% 66%, rgba(89,75,44,.045)),
        var(--paper);
      background-size: 25px 31px, 33px 27px, 100% 100%, auto;
      font-family: "Century Gothic", "Avenir Next", Futura, sans-serif;
    }

    .poster {
      position: relative;
      isolation: isolate;
      width: min(100%, 690px);
      height: min(100%, 1020px);
      padding: clamp(9px, 1.5vmin, 16px);
      overflow: hidden;
      border: clamp(2px, .35vmin, 4px) solid var(--ink);
      background: var(--paper);
      box-shadow:
        0 0 0 clamp(3px, .55vmin, 6px) var(--paper-light),
        0 0 0 clamp(5px, .88vmin, 9px) var(--ink),
        0 16px 44px rgba(17,35,40,.24);
    }

    .poster::after {
      content: "";
      position: absolute;
      z-index: 20;
      inset: 0;
      pointer-events: none;
      opacity: .2;
      mix-blend-mode: multiply;
      background:
        repeating-linear-gradient(0deg, transparent 0 3px, rgba(23,48,58,.035) 4px),
        radial-gradient(ellipse at 28% 12%, rgba(255,255,255,.35), transparent 25%),
        radial-gradient(ellipse at 68% 80%, transparent 30%, rgba(83,68,39,.15) 100%);
    }

    .frame {
      position: relative;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr) auto auto;
      width: 100%;
      height: 100%;
      border: clamp(2px, .35vmin, 4px) solid var(--ink);
    }

    .masthead {
      position: relative;
      z-index: 8;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      min-height: clamp(82px, 12vh, 122px);
      padding: .1em clamp(9px, 2vmin, 20px);
      border-bottom: clamp(2px, .34vmin, 4px) solid var(--ink);
      background: linear-gradient(180deg, #d5eaea, #c5e0e0);
      font-size: clamp(2rem, 6.3vmin, 4rem);
      font-weight: 300;
      line-height: 1;
      letter-spacing: clamp(.07em, .48vw, .19em);
      text-transform: uppercase;
    }

    .masthead span:first-child { text-align: right; }
    .masthead span:last-child { text-align: left; }

    .masthead i {
      align-self: stretch;
      width: 2px;
      margin: 0 clamp(8px, 1.7vmin, 18px);
      background: var(--ink);
      opacity: .75;
    }

    .scene {
      position: relative;
      min-height: 0;
      overflow: hidden;
      background:
        radial-gradient(ellipse at 18% 19%, rgba(255,255,255,.72) 0 7%, transparent 7.5%),
        radial-gradient(ellipse at 76% 15%, rgba(255,255,255,.6) 0 9%, transparent 9.5%),
        linear-gradient(180deg, var(--sky) 0, var(--sky-pale) 73%, #d8d7b4 100%);
    }

    .scene::after {
      content: "";
      position: absolute;
      z-index: 2;
      inset: 0;
      pointer-events: none;
      background:
        radial-gradient(ellipse at 50% 43%, rgba(238,241,218,.82) 0 16%, rgba(229,235,213,.46) 33%, transparent 58%),
        linear-gradient(180deg, transparent 0 68%, rgba(232,222,192,.32) 82%, rgba(232,222,192,.76) 100%);
    }

    .city {
      position: absolute;
      z-index: 1;
      inset: 0;
      width: 100%;
      height: 100%;
      opacity: .68;
      filter: saturate(.72) contrast(.88) blur(.18px);
    }

    .city .windows { opacity: .25; }
    .city .haze { opacity: .66; }

    .word-stage {
      position: relative;
      z-index: 6;
      display: grid;
      grid-template-rows: 1fr;
      justify-items: center;
      align-items: end;
      width: 100%;
      height: 100%;
      padding: clamp(14px, 2.5vmin, 27px) clamp(10px, 2vmin, 22px);
      text-align: center;
    }

    .answer-wrap {
      position: relative;
      align-self: center;
      display: grid;
      place-items: center;
      width: min(100%, 610px);
      min-height: 100%;
    }

    .answer {
      position: relative;
      z-index: 2;
      margin: 0;
      color: var(--ink);
      font-family: "Century Gothic", "Avenir Next", Futura, sans-serif;
      font-size: clamp(10.5rem, 34vh, 22rem);
      font-weight: 300;
      line-height: .72;
      letter-spacing: -.085em;
      text-indent: -.085em;
      text-transform: uppercase;
      transform: scaleX(.86);
      transform-origin: center;
    }

    .caption-band {
      position: relative;
      z-index: 8;
      display: grid;
      place-items: center;
      width: 100%;
      padding: clamp(10px, 1.7vmin, 17px) clamp(12px, 2.4vmin, 24px) clamp(9px, 1.5vmin, 15px);
      border-top: clamp(2px, .34vmin, 4px) solid var(--ink);
      border-bottom: clamp(2px, .34vmin, 4px) solid var(--ink);
      background: var(--paper);
      text-align: center;
    }

    .commentary {
      min-height: 1.18em;
      margin: 0;
      font-family: "Century Gothic", "Avenir Next", Futura, sans-serif;
      font-size: clamp(1.45rem, 3.7vmin, 2.45rem);
      font-style: normal;
      font-weight: 300;
      line-height: 1.14;
      letter-spacing: clamp(.035em, .25vw, .1em);
      text-transform: uppercase;
    }

    .receipt {
      margin: clamp(8px, 1.1vmin, 11px) 0 0;
      font-size: clamp(.72rem, 1.35vmin, .84rem);
      line-height: 1.45;
      letter-spacing: .055em;
    }

    .footer {
      position: relative;
      z-index: 8;
      display: grid;
      place-items: center;
      min-height: clamp(38px, 5.4vh, 54px);
      padding: 7px 12px;
      border-top: clamp(2px, .34vmin, 4px) solid var(--ink);
      background: var(--paper);
      font-size: clamp(.66rem, 1.2vmin, .75rem);
      line-height: 1.3;
      letter-spacing: clamp(.08em, .35vw, .18em);
      text-align: center;
      text-transform: uppercase;
    }

    body.is-friday .scene {
      background:
        radial-gradient(circle at 50% 42%, rgba(255,247,187,.98) 0 8%, rgba(188,163,84,.42) 27%, transparent 54%),
        linear-gradient(180deg, #c8e4df 0, #eae8c3 68%, #d9d3aa 100%);
    }

    body.is-friday .answer {
      color: transparent;
      background: linear-gradient(180deg, #fff7c6 0, var(--brass-light) 22%, var(--brass) 53%, #777a4c 78%, #303f3c 100%);
      background-clip: text;
      -webkit-background-clip: text;
      font-weight: 700;
      letter-spacing: -.12em;
      text-indent: -.12em;
      transform: scaleX(.92) rotate(-1deg);
      -webkit-text-stroke: clamp(2px, .38vmin, 4px) var(--ink);
      text-shadow:
        .025em .025em 0 var(--brass),
        .052em .052em 0 var(--olive),
        .08em .08em 0 var(--ink),
        0 .13em .22em rgba(23,48,58,.28);
      animation: yesIn 560ms cubic-bezier(.16,.9,.24,1.18) both;
    }

    body.is-friday .caption-band {
      border-color: var(--brass);
      background: var(--paper-light);
    }

    @keyframes yesIn {
      from { opacity: 0; transform: scale(.68) scaleX(.92) rotate(-4deg); }
      to { opacity: 1; transform: scale(1) scaleX(.92) rotate(-1deg); }
    }

    @media (max-width: 520px) {
      .poster { width: 100%; height: 100%; }
      .answer { font-size: min(63vw, 31vh); }
      .masthead { font-size: clamp(1.85rem, 8vw, 2.35rem); }
      .answer-wrap { min-height: 100%; }
      .caption-band { padding-inline: 10px; }
      .commentary { font-size: clamp(1.3rem, 6.2vw, 1.75rem); }
    }

    @media (max-height: 650px) {
      .masthead { min-height: 54px; font-size: clamp(1.35rem, 6.6vh, 2rem); }
      .footer { min-height: 30px; padding-block: 4px; }
      .word-stage { padding-block: 7px; }
      .answer { font-size: min(45vw, 30vh); }
      .caption-band { padding-block: 6px; }
      .commentary { font-size: clamp(1rem, 4.7vh, 1.45rem); }
      .receipt { margin-top: 4px; font-size: clamp(.66rem, 2.2vh, .76rem); }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: .001ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .001ms !important;
      }
    }
  </style>
</head>
<body>
  <main class="poster" aria-labelledby="answer">
    <div class="frame">
      <header class="masthead" aria-label="Is it Friday?">
        <span>Is it</span><i aria-hidden="true"></i><span>Friday?</span>
      </header>

      <section class="scene" aria-live="polite">
        <svg class="city" viewBox="0 0 900 1000" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
          <defs>
            <linearGradient id="tower" x1="0" x2="1">
              <stop offset="0" stop-color="#536c70" />
              <stop offset=".48" stop-color="#c9d3c6" />
              <stop offset="1" stop-color="#61777a" />
            </linearGradient>
            <linearGradient id="stone" x1="0" x2="1">
              <stop offset="0" stop-color="#839080" />
              <stop offset=".55" stop-color="#d0d2b6" />
              <stop offset="1" stop-color="#6e8078" />
            </linearGradient>
            <linearGradient id="airship" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#a9ae8c" />
              <stop offset="1" stop-color="#354e54" />
            </linearGradient>
            <pattern id="windowGrid" width="22" height="25" patternUnits="userSpaceOnUse">
              <rect x="5" y="6" width="5" height="8" rx="1" fill="#21444f" />
              <rect x="14" y="6" width="4" height="8" rx="1" fill="#21444f" />
            </pattern>
          </defs>

          <g class="haze" fill="#f7f4da">
            <ellipse cx="168" cy="168" rx="128" ry="48" />
            <ellipse cx="710" cy="236" rx="150" ry="52" />
          </g>

          <g transform="translate(612 92) rotate(8)">
            <path d="M0 55C44 4 166 2 226 52C174 102 45 105 0 55Z" fill="url(#airship)" stroke="#17303a" stroke-width="4" />
            <path d="M29 55H202M62 25Q83 55 62 84M122 12Q143 55 122 96M176 24Q193 55 176 84" fill="none" stroke="#d8d7b4" stroke-width="2" opacity=".42" />
            <path d="M14 45L-26 24L-12 58L-33 78L18 68Z" fill="#233d44" />
            <rect x="104" y="91" width="51" height="13" rx="4" fill="#354e54" />
          </g>

          <g transform="translate(96 245) rotate(-9) scale(.55)">
            <path d="M0 38C34 3 136 1 185 36C142 73 35 75 0 38Z" fill="url(#airship)" stroke="#17303a" stroke-width="4" />
            <path d="M15 31L-16 18L-6 41L-20 56L18 47Z" fill="#233d44" />
          </g>

          <g opacity=".86">
            <path d="M330 1000V450H430V335H470V250H490V180L510 130L530 180V250H551V335H590V450H690V1000Z" fill="url(#tower)" stroke="#17303a" stroke-width="4" />
            <path d="M456 335H565M431 450H590M408 518H613" stroke="#17303a" stroke-width="5" opacity=".55" />
            <path d="M510 60V250M490 180H530M470 250H551" stroke="#17303a" stroke-width="4" />
            <path d="M466 350H556V950H466Z" fill="url(#windowGrid)" class="windows" />
          </g>

          <g opacity=".72">
            <path d="M28 1000V420H248V1000Z" fill="url(#stone)" stroke="#17303a" stroke-width="4" />
            <path d="M48 458H228V980H48Z" fill="url(#windowGrid)" class="windows" />
            <path d="M52 420V354H224V420M72 354V324H203V354" fill="#899582" stroke="#17303a" stroke-width="4" />
            <path d="M663 1000V520H874V1000Z" fill="url(#stone)" stroke="#17303a" stroke-width="4" />
            <path d="M684 553H854V985H684Z" fill="url(#windowGrid)" class="windows" />
            <path d="M688 520V474H848V520" fill="#8b9684" stroke="#17303a" stroke-width="4" />
          </g>
        </svg>

        <div class="word-stage">
          <div class="answer-wrap">
            <h1 class="answer" id="answer">NO</h1>
          </div>
        </div>
      </section>

      <aside class="caption-band" aria-live="polite">
        <p class="commentary" id="commentary">Checking your device clock.</p>
        <p class="receipt" id="receipt">It's a day where you are. Checked your device clock, nothing else.</p>
      </aside>

      <footer class="footer">AI assisted. Human approved. Powered by NLP.</footer>
    </div>
  </main>

  <script>
    "use strict";

    const days = [
      { weekday: "Sunday", answer: "NO", commentary: "Don't." },
      { weekday: "Monday", answer: "NO", commentary: "Absolutely not." },
      { weekday: "Tuesday", answer: "NO", commentary: "Not even close." },
      { weekday: "Wednesday", answer: "NO", commentary: "Halfway. That's all I've got." },
      { weekday: "Thursday", answer: "NO", commentary: "But tomorrow. Hold on." },
      { weekday: "Friday", answer: "YES", commentary: "Go." },
      { weekday: "Saturday", answer: "NO", commentary: "It was. You missed it." }
    ];

    function renderDay(dayIndex) {
      const day = days[dayIndex];
      document.getElementById("answer").textContent = day.answer;
      document.getElementById("commentary").textContent = day.commentary;
      document.getElementById("receipt").textContent = `It's ${day.weekday} where you are. Checked your device clock, nothing else.`;
      document.body.classList.toggle("is-friday", dayIndex === 5);
      document.title = "Is It Friday?";
    }

    renderDay(new Date().getDay());
  </script>
</body>
</html>
